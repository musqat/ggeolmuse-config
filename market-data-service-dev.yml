spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Keycloak (secret만 프로파일별)
keycloak:
  credentials:
    secret: ${KEYCLOAK_SECRET:dev-secret}

# Market Data 설정
marketdata:
  symbol-listing:
    max-symbols: ${SYMBOL_LISTING_MAX:50}  # 개발 환경 기본 50. 환경변수로 덮을 수 있다

# Logging
logging:
  level:
    com.muscat.marketdata: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
