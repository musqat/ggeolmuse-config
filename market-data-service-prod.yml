spring:
  # PostgreSQL RDS (환경변수로 주입)
  datasource:
    url: ${DB_URL_MARKET}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      # 쿼리 한 건 120초 · 잠금 대기 10초 상한(일봉 배치용으로 공통 60초보다 길게)
      connection-init-sql: "SET statement_timeout = '120s'; SET lock_timeout = '10s'"

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          # 전 기간 백필은 심볼당 2천 행이 넘는다. 공통값 20 으로는 왕복이 너무 잦다
          batch_size: 100

marketdata:
  provider: yahoo

# Logging
logging:
  level:
    com.muscat.marketdata: INFO
    org.springframework.security: WARN
