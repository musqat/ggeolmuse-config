spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Keycloak (secret만 프로파일별)
keycloak:
  credentials:
    secret: ${KEYCLOAK_SECRET:dev-secret}

# Logging
logging:
  level:
    com.muscat.trade: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
