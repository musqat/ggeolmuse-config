# Backtest Service 공통 설정
server:
  port: 8082

# backtest-service → market-data-service
resilience4j:
  circuitbreaker:
    instances:
      # 호출은 Feign 으로 한다. Feign 은 HttpServerErrorException 을 던지지 않고
      # FeignException 계열을 던진다. RestTemplate 시절 목록을 그대로 두면 5xx 를
      # 아무리 받아도 실패로 세지 않아 서킷이 열리지 않는다.
      #
      # 5xx 는 FeignServerException, 4xx 는 FeignClientException 이 부모다.
      # ServerError 나 ClientError 라는 이름은 없다. 틀리면 기동 자체가 실패한다.
      marketDataService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest

  retry:
    instances:
      # 재시도 예외도 위 서킷처럼 Feign 예외로 적음. 4xx 는 다시 불러도 결과가 같아 재시도 안 함
      marketDataService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest

# Feign 클라이언트 타임아웃. 재시도 3번(1초 · 2초 쉼)이 게이트웨이 30초 안에 들게 잡음
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 5000
          # 긴 일봉 이력. 재시도까지 27초
          market-data-internal:
            readTimeout: 8000

# Backtest Service 비즈니스 설정
backtest:
  calculation:
    precision: 8
    scale: 4
    max-years: 50
    min-days: 7

  concurrent:
    max-threads: 4
    queue-capacity: 100
    timeout-minutes: 30

  rate-limit:
    max-requests-per-minute: 1000
    max-concurrent-backtests: 20
    daily-limit-per-user: 10000

  strategy:
    dca:
      min-monthly-amount: 100.00
      max-monthly-amount: 10000.00
    conditional:
      min-drop-percentage: 5
      max-drop-percentage: 50
      min-total-investment: 1000.00

  comparison:
    max-symbols: 10
    max-strategies: 5
    max-timings: 10

  validation:
    min-investment-amount: 100.00
    max-investment-amount: 10000000.00
    max-trading-fee: 0.05
    required-data-points: 30

  cache:
    result-ttl-hours: 24
    history-ttl-hours: 168
    max-cache-size: 1000

  storage:
    auto-save-enabled: true
    max-results-per-user: 1000
    cleanup-days: 90

# 서비스 URL
app:
  market-data:
    url: ${MARKET_DATA_SERVICE_URL:http://market-data-service:8083}
