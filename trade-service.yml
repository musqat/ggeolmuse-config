# Trade Service 공통 설정
server:
  port: 8081

# trade-service → user-service
# trade-service → market-data-service
resilience4j:
  circuitbreaker:
    instances:
      # 호출은 Feign 으로 한다. RestTemplate 예외를 적어두면 5xx 를 받아도
      # 실패로 세지 않아 서킷이 열리지 않는다. backtest 에서 고친 것과 같은 병이다.
      #
      # 인스턴스 이름은 코드의 @CircuitBreaker(name = "marketService") 를 따른다.
      # 예전에 marketDataService 로 적혀 있어 설정이 붙지 않았고,
      # 기본값(minimumNumberOfCalls 100)으로 돌았다.
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest

      marketService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException

      marketService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException

# Feign 클라이언트 타임아웃. 재시도 3번(1초 · 2초 쉼)이 게이트웨이 30초 안에 들게 잡음
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 5000

# Trade Service 비즈니스 설정
trade:
  fee:
    default-rate: ${TRADE_FEE_RATE:0.0025}
  calculation:
    price-precision: ${PRICE_PRECISION:2}

# 서비스 URL
market-service:
  url: ${MARKET_DATA_SERVICE_URL:http://market-data-service:8083}
user-service:
  url: ${USER_SERVICE_URL:http://user-service:8080}
