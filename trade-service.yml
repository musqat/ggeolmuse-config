# Trade Service 공통 설정
server:
  port: 8081

# trade-service → user-service
# trade-service → market-data-service
resilience4j:
  circuitbreaker:
    instances:
      # 호출은 Feign 으로 한다. RestTemplate 예외를 적어두면 5xx 를 받아도
      # 실패로 세지 않아 서킷이 열리지 않는다. backtest 에서 고친 것과 같은 병이다.
      #
      # 인스턴스 이름은 코드의 @CircuitBreaker(name = "marketService") 를 따른다.
      # 예전에 marketDataService 로 적혀 있어 설정이 붙지 않았고,
      # 기본값(minimumNumberOfCalls 100)으로 돌았다.
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest

      marketService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest

  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.util.concurrent.TimeoutException

      marketService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
          - java.util.concurrent.TimeoutException

  timelimiter:
    instances:
      userService:
        timeoutDuration: 5s
        cancelRunningFuture: true

      marketService:
        timeoutDuration: 8s
        cancelRunningFuture: true

  bulkhead:
    instances:
      userService:
        maxConcurrentCalls: 15
        maxWaitDuration: 500ms

      marketService:
        maxConcurrentCalls: 10
        maxWaitDuration: 500ms

  ratelimiter:
    instances:
      userService:
        limitForPeriod: 150
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

      marketService:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

# Feign Client 타임아웃
feign:
  client:
    config:
      default:
        connectTimeout: 500
        readTimeout: 1000
        loggerLevel: basic

# Trade Service 비즈니스 설정
trade:
  fee:
    default-rate: ${TRADE_FEE_RATE:0.0025}
    minimum-amount: ${TRADE_FEE_MIN:1.00}
    maximum-rate: ${TRADE_FEE_MAX:0.01}
  calculation:
    price-precision: ${PRICE_PRECISION:2}
    quantity-precision: ${QUANTITY_PRECISION:6}
    currency-precision: ${CURRENCY_PRECISION:2}
  validation:
    max-price-deviation: ${MAX_PRICE_DEVIATION:0.20}
    min-trade-amount: ${MIN_TRADE_AMOUNT:1.00}
    max-trade-amount: ${MAX_TRADE_AMOUNT:1000000.00}
    max-daily-trades: ${MAX_DAILY_TRADES:1000}
  cache:
    market-data-ttl: ${CACHE_MARKET_DATA_TTL:300}
    portfolio-ttl: ${CACHE_PORTFOLIO_TTL:600}
    balance-ttl: ${CACHE_BALANCE_TTL:300}
  fifo:
    enabled: ${FIFO_ENABLED:true}
    precision: ${FIFO_PRECISION:8}

# 서비스 URL
market-service:
  url: ${MARKET_DATA_SERVICE_URL:http://market-data-service:8083}
user-service:
  url: ${USER_SERVICE_URL:http://user-service:8080}
